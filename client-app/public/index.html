<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WanderOn</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>

  <nav class="navbar">
    <div class="navbar-brand">
      <!-- Compass icon -->
      <svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M16.24 7.76l-2.12 6.36-6.36 2.12 2.12-6.36 6.36-2.12z"/>
      </svg>
      WanderOn
    </div>
  </nav>

  <main class="hero">
    <div class="hero-card">

      <div class="hero-icon">
        <!-- Mountain landscape icon -->
        <svg width="34" height="34" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M3 20l5-8 3 4 4-7 6 11H3z"/>
          <circle cx="17" cy="5" r="2" stroke-width="1.8"/>
        </svg>
      </div>

      <h1>Sign in to WanderOn</h1>
      <p>Plan trips, discover destinations, and share your adventures.</p>

      <!-- Error banner (shown when ?error= is in the URL) -->
      <div id="errorBanner" class="error-banner hidden" role="alert"></div>

      <a href="/login" class="btn-primary" id="loginBtn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
        </svg>
        Sign in
      </a>

      <a href="/register" class="btn-secondary" id="registerBtn">
        <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round"
            d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
        </svg>
        New to WanderOn? Create account
      </a>

    </div>
  </main>

  <script>
    // Display error message from query string (e.g. ?error=invalid_state)
    // Only known error keys are mapped — unknown keys show a generic message,
    // never reflecting untrusted query-string content into the DOM.
    const params   = new URLSearchParams(window.location.search);
    const errorKey = params.get('error');
    if (errorKey) {
      const messages = {
        invalid_state:        'Sign-in failed: security token mismatch. Please try again.',
        missing_code:         'Sign-in failed: no authorisation code received.',
        token_exchange_failed:'Sign-in failed: could not complete the authentication handshake.',
        server_error:         'Something went wrong on our end. Please try again.',
        session_expired:      'Your session has expired. Please sign in again.',
      };
      const banner = document.getElementById('errorBanner');
      // textContent — never innerHTML — so the value cannot inject HTML/JS
      banner.textContent = messages[errorKey] || 'Sign-in failed. Please try again.';
      banner.classList.remove('hidden');
      window.history.replaceState({}, '', '/');
    }
  </script>

</body>
</html>
